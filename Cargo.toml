[package]
name = "packcaptain"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6"
fs2 = "0.4"
ratatui = "0.30"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
walkdir = "2"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
portable-pty = "0.9"
tempfile = "3"
